# /etc/nginx/sites-available/pointage  (remplacer pointage.exemple.cm par le vrai domaine)
server {
    listen 80;
    server_name pointage.exemple.cm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pointage.exemple.cm;

    # Certificats Let's Encrypt : sudo certbot --nginx -d pointage.exemple.cm
    ssl_certificate     /etc/letsencrypt/live/pointage.exemple.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pointage.exemple.cm/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Remplace (et non complete) l'en-tete : l'IP vue par l'API est celle du client reel
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
